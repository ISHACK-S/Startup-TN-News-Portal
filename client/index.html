<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#293f80" />
    <meta
      name="description"
      content="The latest news, ideas and updates from Tamil Nadu's startup ecosystem."
    />
    <script>
      (() => {
        let theme;
        try {
          theme = localStorage.getItem('startuptn-public-theme');
        } catch {
          theme = null;
        }
        if (theme !== 'light' && theme !== 'dark') {
          theme = 'light';
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>StartupTN News — Stories shaping tomorrow</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
